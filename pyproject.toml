[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msfauto"
version = "0.1.0"
description = "A local, policy-controlled terminal orchestrator for authorized security assessment workflows."
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0,<2",
    "textual>=0.58,<2",
    "rich>=13.7,<15",
    "prompt-toolkit>=3.0.43,<4",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
msfauto = "msfauto.cli:main"

[tool.setuptools.packages.find]
where = ["."]
